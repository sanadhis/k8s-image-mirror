name: Chart PR

on:
  pull_request:
    paths:
      - 'chart/templates/**'
      - 'chart/tests/**'
      - 'chart/values**'

jobs:
  helm:
    name: Helm chart test
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        id: install-helm
        with:
          version: 'v3.20.2'

      - name: Install Helm plugins
        shell: bash
        run: |
          make plugins

      - name: Test Helm Chart
        shell: bash
        run: |
          make helm-test
