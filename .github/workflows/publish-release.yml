name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'

jobs:
  publish-and-release:
    name: Publish and Release
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        id: install-helm
        with:
          version: 'v3.20.2'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Log in to ghcr.io container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to ghcr.io OCI registry
        env:
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        shell: bash
        run: |
          make helm-login HELM_REGISTRY=oci://ghcr.io/sanadhis

      - name: Create release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_GITHUB_PAT }}

      - name: Build and Push Docker images
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: docker
          push: true
          tags: ghcr.io/sanadhis/k8s-image-mirror:${{ steps.release.outputs.version }}
          platforms: linux/amd64,linux/arm64

      - name: Package Helm Charts
        shell: bash
        run: |
          make package IMAGE_TAG=${{ steps.release.outputs.version }}

      - name: Publish Helm Charts
        shell: bash
        run: |
          make publish IMAGE_TAG=${{ steps.release.outputs.version }} HELM_REGISTRY=oci://ghcr.io/sanadhis/charts
