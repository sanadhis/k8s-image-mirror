suite: Secret
templates:
  - secret.yaml

release:
  name: k8s-image-mirror
  namespace: default

tests:
  - it: should create 2 Secrets by default
    asserts:
      - hasDocuments:
          count: 2

  - it: should create target credentials Secret
    asserts:
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: k8s-image-mirror-target-credentials
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: default
        documentIndex: 0

  - it: should create source credentials Secret
    asserts:
      - isKind:
          of: Secret
        documentIndex: 1
      - equal:
          path: metadata.name
          value: k8s-image-mirror-source-credentials
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: default
        documentIndex: 1

  - it: should store target registry credentials in stringData
    set:
      credentials.targetRegistryUsername: targetuser
      credentials.targetRegistryPassword: targetpass
    asserts:
      - equal:
          path: stringData.username
          value: targetuser
        documentIndex: 0
      - equal:
          path: stringData.password
          value: targetpass
        documentIndex: 0

  - it: should store source registry credentials in stringData
    set:
      credentials.sourceRegistryUsername: sourceuser
      credentials.sourceRegistryPassword: sourcepass
    asserts:
      - equal:
          path: stringData.username
          value: sourceuser
        documentIndex: 1
      - equal:
          path: stringData.password
          value: sourcepass
        documentIndex: 1

  - it: should use custom key names for target registry credentials
    set:
      credentials.targetRegistryUsernameKey: TARGET_USER
      credentials.targetRegistryPasswordKey: TARGET_PASS
      credentials.targetRegistryUsername: targetuser
      credentials.targetRegistryPassword: targetpass
    asserts:
      - equal:
          path: stringData.TARGET_USER
          value: targetuser
        documentIndex: 0
      - equal:
          path: stringData.TARGET_PASS
          value: targetpass
        documentIndex: 0

  - it: should use custom key names for source registry credentials
    set:
      credentials.sourceRegistryUsernameKey: SOURCE_USER
      credentials.sourceRegistryPasswordKey: SOURCE_PASS
      credentials.sourceRegistryUsername: sourceuser
      credentials.sourceRegistryPassword: sourcepass
    asserts:
      - equal:
          path: stringData.SOURCE_USER
          value: sourceuser
        documentIndex: 1
      - equal:
          path: stringData.SOURCE_PASS
          value: sourcepass
        documentIndex: 1

  - it: should not create target Secret when existingTargetRegistrySecret is set
    set:
      credentials.existingTargetRegistrySecret: my-target-secret
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: k8s-image-mirror-source-credentials
        documentIndex: 0

  - it: should not create source Secret when existingSourceRegistrySecret is set
    set:
      credentials.existingSourceRegistrySecret: my-source-secret
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: k8s-image-mirror-target-credentials
        documentIndex: 0

  - it: should not create any Secret when both existing secrets are set
    set:
      credentials.existingTargetRegistrySecret: my-target-secret
      credentials.existingSourceRegistrySecret: my-source-secret
    asserts:
      - hasDocuments:
          count: 0
