suite: ServiceAccount
templates:
  - serviceaccount.yaml

release:
  name: k8s-image-mirror
  namespace: default

tests:
  - it: should create a ServiceAccount by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: k8s-image-mirror
      - equal:
          path: metadata.namespace
          value: default

  - it: should use custom name when serviceAccount.name is set
    set:
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: should use fullnameOverride when set
    set:
      fullnameOverride: my-mirror
      serviceAccount.name: ""
    asserts:
      - equal:
          path: metadata.name
          value: my-mirror

  - it: should add annotations when configured
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/my-role
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789:role/my-role

  - it: should not create ServiceAccount when disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
